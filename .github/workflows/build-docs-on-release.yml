name: Build Docs on Release

# Triggered after "Create Release on Version Change" completes.
# Using workflow_run instead of release:published because releases created
# by GITHUB_TOKEN in another workflow do not fire the release event for
# downstream workflows (GitHub Actions security restriction).
on:
  workflow_run:
    workflows: ["Create Release on Version Change"]
    types: [completed]

jobs:
  build-docs:
    # Only run when the release workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocstrings mkdocstrings-python markdown-include

      - name: Build documentation
        run: |
          mkdocs build

      - name: Upload built docs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: site/
